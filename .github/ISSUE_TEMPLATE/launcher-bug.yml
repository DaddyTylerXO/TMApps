name: Launcher Bug report
description: Bug report for TMApps Launcher
title: "[Launcher] Bug report"
body:
  - type: input
    id: app
    attributes:
      label: Application and version
      value: TMApps Launcher
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Details and expected behaviour
      description: Review before submitting. Do not include credentials, mail content or private files.
    validations:
      required: true
