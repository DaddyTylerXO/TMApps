name: Verify and publish Socials Manager
on:
  push:
    branches: [TMA-SocialsManager]
    paths-ignore:
      - 'docs/**'
      - '.cursor/**'
      - 'AGENTS.md'
      - 'APP-STANDARDS.md'
      - 'README.md'
      - 'OAUTH-SETUP.md'
      - 'CHANGELOG.md'
      - 'scripts/build-kb*'
      - 'scripts/check-kb.py'
      - 'scripts/render_docx.py'
      - '.github/workflows/verify-kb.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: socialsmanager-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64}
          - {os: macos-15-intel, platform: mac, arch: x64}
          - {os: macos-latest, platform: mac, arch: arm64}
          - {os: ubuntu-latest, platform: linux, arch: x64}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm test
      - run: node scripts/check-secrets.cjs
      - name: Windows desktop regression checks
        if: runner.os == 'Windows'
        run: node node_modules/electron/cli.js . --smoke
      - run: node scripts/icons.cjs
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged launch and idle budgets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $check = Start-Process -FilePath './dist/win-unpacked/TMA-SocialsManager.exe' -ArgumentList '--verify-launch' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Packaged launch check failed.' }
          Get-Content artifacts/launch-win32-x64.json
      - name: Verify packaged launch and idle budgets on macOS
        if: runner.os == 'macOS'
        run: |
          package=$(find dist -path '*/Contents/MacOS/TMA-SocialsManager' -type f -print -quit)
          "$package" --verify-launch
          cat artifacts/launch-darwin-*.json
      - name: Verify packaged launch and idle budgets on Linux
        if: runner.os == 'Linux'
        run: |
          package=$(find dist -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          chmod +x "$package"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$package" --verify-launch --no-sandbox
          cat artifacts/launch-linux-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/launch-*.json
      - run: node scripts/release-metadata.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: socials-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.AppImage
            dist/*.sha256
            dist/metadata-*.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tmapps-shared-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: socials-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge verified packages into current launcher catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tma-apps --pattern catalog.json --dir prior-catalog
          node scripts/publish-catalog.cjs
      - name: Upload packages before catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.sha256' \) -print0 | xargs -0 gh release upload tma-apps --clobber
          gh release upload tma-apps socialsmanager-release.json --clobber
          gh release upload tma-apps catalog.json --clobber
