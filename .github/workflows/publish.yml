name: Publish launcher for Windows, macOS and Linux
on:
  workflow_dispatch:
    inputs:
      rebuild_companion_apps:
        description: Rebuild companion apps only when their releases are authorized
        type: boolean
        default: false
  push:
    branches: [TMApps-Launcher]
    paths: ['desktop/**', 'src/**', 'assets/**', 'content/**', 'backend/**', 'tools/**', 'docs/**', 'catalog.json', 'build.ps1', 'package.ps1', 'make-icon.ps1', 'tests/**', 'test.ps1', '.github/workflows/publish.yml']
permissions:
  contents: write
concurrency:
  group: tmapps-publish
  cancel-in-progress: false
jobs:
  publish:
    concurrency:
      group: tmapps-shared-catalog
      cancel-in-progress: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: launcher
      - uses: actions/checkout@v4
        if: ${{ inputs.rebuild_companion_apps == true }}
        with:
          ref: TMA-Mail
          path: mail
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: ${{ inputs.rebuild_companion_apps == true }}
        with:
          ref: TMA-AgentOffice
          path: office
      - uses: actions/checkout@v4
        if: ${{ inputs.rebuild_companion_apps == true }}
        with:
          ref: TMA-Libraries
          path: libraries
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: ${{ inputs.rebuild_companion_apps == true }}
        with:
          ref: TMA-Finance
          path: finance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Verify launcher source and bundled catalog
        shell: powershell
        run: |
          ./launcher/test.ps1
      - name: Preserve published companion application packages
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download tma-apps --pattern catalog.json --dir prior-catalog
          if ($LASTEXITCODE -eq 0) {
            $prior = Get-Content prior-catalog/catalog.json -Raw | ConvertFrom-Json
            $rebuild = '${{ inputs.rebuild_companion_apps }}' -eq 'true'
            $securityApps = @($prior.apps | Where-Object { (!$rebuild -or $_.id -in @("tma-safe", "tma-padlock", "tma-socialsmanager", "tma-cut")) -and $_.downloadUrl })
            if ($securityApps.Count -gt 0) {
              $catalog = Get-Content launcher/catalog.json -Raw | ConvertFrom-Json
              $catalog.apps = @($catalog.apps | ForEach-Object { $current = $_; $published = $securityApps | Where-Object id -eq $current.id; if ($published) { $published } else { $current } })
              $catalog | ConvertTo-Json -Depth 10 | Set-Content launcher/catalog.json -Encoding UTF8
            }
          } else { throw 'Cannot safely publish without the existing application catalog' }
          $global:LASTEXITCODE=0
      - name: Build Agent Office from its application branch
        if: ${{ inputs.rebuild_companion_apps == true }}
        working-directory: office
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime download failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Agent Office tests failed' }
          pnpm exec electron-builder --win --dir
          if ($LASTEXITCODE -ne 0) { throw 'Agent Office packaging failed' }
      - name: Verify and build Libraries Windows app
        if: ${{ inputs.rebuild_companion_apps == true }}
        shell: powershell
        run: |
          ./libraries/build.ps1 -Test
          if ($LASTEXITCODE -ne 0) { throw 'Libraries build or storage/smoke verification failed' }
          ./libraries/scripts/security-check.ps1
      - name: Verify and build Finance Windows app
        if: ${{ inputs.rebuild_companion_apps == true }}
        working-directory: finance/tma-finance
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Finance dependency restore failed' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Finance Electron download failed' }
          pnpm run check
          if ($LASTEXITCODE -ne 0) { throw 'Finance syntax verification failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Finance tests failed' }
          pnpm exec electron-builder --win --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Finance packaging failed' }
      - name: Prepare verified application packages
        if: ${{ inputs.rebuild_companion_apps == true }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force published | Out-Null
          $catalog = Get-Content launcher/catalog.json -Raw | ConvertFrom-Json
          $mail = Get-ChildItem mail/dist/TMA-Mail-*-windows.zip | Sort-Object { [version]([regex]::Match($_.Name,'(\d+\.\d+\.\d+)').Value) } -Descending | Select-Object -First 1
          if (!$mail) { throw 'No published mail package found' }
          $expected = (Get-Content ($mail.FullName + '.sha256') -Raw).Split(' ')[0].Trim()
          if ((Get-FileHash $mail.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Mail checksum mismatch' }
          Copy-Item $mail.FullName published/
          $mailApp = $catalog.apps | Where-Object id -eq 'tma-mail'
          $mailApp.version = $mail.Name -replace '^TMA-Mail-','' -replace '-windows.zip$',''
          $mailApp.downloadUrl = "https://github.com/DaddyTylerXO/TMApps/releases/download/tma-apps/$($mail.Name)"
          $mailApp.sha256 = $expected.ToLowerInvariant()
          $mailApp.updatedAt = (git -C mail log -1 --format=%cI -- "dist/$($mail.Name)").Trim()
          $officeVersion = (Get-Content office/package.json -Raw | ConvertFrom-Json).version
          if (!(Test-Path 'office/dist/win-unpacked/Agent Office.exe')) { throw 'Agent Office executable missing' }
          $officeName = "TMA-Agent-Office-$officeVersion-windows.zip"
          Compress-Archive -Path office/dist/win-unpacked/* -DestinationPath "published/$officeName" -CompressionLevel Optimal
          $officeApp = $catalog.apps | Where-Object id -eq 'tma-agent-office'
          $officeApp.version = $officeVersion
          $officeApp.updatedAt = (git -C office log -1 --format=%cI).Trim()
          $officeApp.downloadUrl = "https://github.com/DaddyTylerXO/TMApps/releases/download/tma-apps/$officeName"
          $officeApp.sha256 = (Get-FileHash "published/$officeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $librariesVersion = [regex]::Match((Get-Content libraries/docs/RELEASE-NOTES.md -Raw), '(?m)^## (\d+\.\d+\.\d+)').Groups[1].Value
          if (!$librariesVersion) { throw 'Libraries release version missing' }
          $librariesName = "TMA-Libraries-$librariesVersion-windows.zip"
          Compress-Archive -Path libraries/build/TMA-Libraries.exe,libraries/build/TMA-Libraries.exe.config,libraries/build/docs -DestinationPath "published/$librariesName" -CompressionLevel Optimal
          $financeVersion = (Get-Content finance/tma-finance/package.json -Raw | ConvertFrom-Json).version
          $financeName = "TMA-Finance-$financeVersion-windows.zip"
          Compress-Archive -Path finance/tma-finance/release/win-unpacked/* -DestinationPath "published/$financeName" -CompressionLevel Optimal
          foreach ($newApp in @(@{id='tma-libraries';version=$librariesVersion;file=$librariesName;directory='libraries';paths=@('src','assets','docs/RELEASE-NOTES.md')},@{id='tma-finance';version=$financeVersion;file=$financeName;directory='finance';paths=@('tma-finance/desktop','tma-finance/dist','tma-finance/package.json')})) {
            $entry = $catalog.apps | Where-Object id -eq $newApp.id
            if (!$entry) { throw 'New app missing from launcher catalog' }
            $entry.version = $newApp.version
            $entry.platforms = @('windows')
            $appPaths = @($newApp.paths)
            $entry.updatedAt = (git -C $newApp.directory log -1 --format=%cI -- $appPaths).Trim()
            $entry.downloadUrl = "https://github.com/DaddyTylerXO/TMApps/releases/download/tma-apps/$($newApp.file)"
            $entry.sha256 = (Get-FileHash "published/$($newApp.file)" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $catalog | ConvertTo-Json -Depth 6 | Set-Content published/catalog.json -Encoding UTF8
          ./launcher/tools/verify-windows-app-packages.ps1 -CatalogPath published/catalog.json -PackageDirectory published -OutputDirectory launcher/build/app-package-verification
          if ($LASTEXITCODE -ne 0) { throw 'Real app installation/launch/uninstall verification failed' }
      - name: Reuse existing app catalog for launcher-only release
        if: ${{ inputs.rebuild_companion_apps != true }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force published | Out-Null
          [Reflection.Assembly]::LoadFile((Resolve-Path launcher/build/TMApps-Launcher.exe).Path) | Out-Null
          $validated = [TMApps.LauncherService]::ParseCatalog((Get-Content launcher/catalog.json -Raw))
          foreach ($id in @('tma-libraries','tma-finance')) {
            if (!($validated.apps | Where-Object { $_.id -eq $id -and $_.downloadUrl })) { throw "Required published app is missing: $id" }
          }
          Copy-Item launcher/catalog.json published/catalog.json
      - name: Package launcher without releasing unrequested companion changes
        shell: powershell
        run: |
          # Embed the exact catalog for the packages built by this run.
          Copy-Item published/catalog.json launcher/catalog.json -Force
          ./launcher/package.ps1
          Copy-Item launcher/dist/TMApps-Launcher-Setup.exe* published/
          $launcherVersion = (Get-Item launcher/dist/TMApps-Launcher-Setup.exe).VersionInfo.FileVersion -replace '\.0$',''
          $versionedSetup = "TMApps-Launcher-Setup-$launcherVersion.exe"
          Copy-Item launcher/dist/TMApps-Launcher-Setup.exe "published/$versionedSetup"
          @{ schemaVersion=1; version=$launcherVersion; downloadUrl="https://github.com/DaddyTylerXO/TMApps/releases/download/tma-apps/$versionedSetup"; sha256=(Get-FileHash "published/$versionedSetup" -Algorithm SHA256).Hash.ToLowerInvariant(); updatedAt=[DateTime]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content published/launcher-update.json -Encoding UTF8
          Get-ChildItem published/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TMApps-Windows
          path: |
            published/*
            launcher/build/windows-performance.json
            launcher/build/app-package-verification/finance-verification/finance-performance.json
      - name: Publish application packages, then catalog
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = gh release list --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          if (@($existing) -notcontains 'tma-apps') {
            gh release create tma-apps --target $env:GITHUB_SHA --title 'TMApps · Windows downloads' --notes 'Download TMApps-Launcher-Setup.exe to install the launcher. Choose Windows startup, desktop icon, and close-to-tray options during setup. Windows 10/11 x64 with .NET Framework 4.8. Unsigned beta builds.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = Get-ChildItem published/* | Where-Object { $_.Name -ne 'catalog.json' -and $_.Name -ne 'launcher-update.json' } | ForEach-Object FullName
          gh release upload tma-apps @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Package upload failed; catalog was not published' }
          gh release upload tma-apps published/catalog.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Catalog upload failed' }
          Copy-Item 'launcher/docs/KB Library.docx' published/KB.Library.docx
          Copy-Item 'launcher/docs/TMApps Launcher KB Library.docx' published/TMApps-Launcher-KB.Library.docx
          gh release upload tma-apps published/KB.Library.docx published/TMApps-Launcher-KB.Library.docx --clobber
          if ($LASTEXITCODE -ne 0) { throw 'KB Library upload failed' }
          gh release upload tma-apps published/launcher-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Launcher update manifest upload failed' }
          gh release edit tma-apps --notes-file launcher/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release description update failed' }
          $names = gh release view tma-apps --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list old launcher assets' }
          foreach ($name in $names) {
            if ($name -match '^TMApps-Launcher-[0-9.]+-windows-x64\.zip(\.sha256)?$' -or $name -match '^TMApps-Launcher\.exe(\.sha256)?$') {
              gh release delete-asset tma-apps $name --yes
              if ($LASTEXITCODE -ne 0) { throw 'Could not remove obsolete launcher ZIP' }
            }
          }

  native-launcher:
    needs: publish
    name: Native launcher (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Restore pinned desktop dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
          cp ../catalog.json catalog.json
          node -e "if(process.arch!=='${{ matrix.arch }}'||process.platform!=='${{ matrix.platform }}')throw Error('Wrong native runner architecture')"
      - name: Test native backend and UI
        run: pnpm test
      - name: Smoke test Electron on Linux
        timeout-minutes: 3
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm exec electron . --no-sandbox --smoke "$PWD/build/source-smoke.json"
      - name: Smoke test Electron on macOS
        timeout-minutes: 3
        if: matrix.platform == 'darwin'
        run: pnpm exec electron . --smoke "$PWD/build/source-smoke.json"
      - name: Package native installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          curl --fail --location --retry 3 'https://github.com/DaddyTylerXO/TMApps/releases/download/tma-apps/catalog.json?run=${{ github.run_id }}' -o catalog.json
          node -e "const c=require('./electron/service.cjs').parseCatalog(require('./catalog.json'));for(const id of ['tma-libraries','tma-finance'])if(!c.apps.find(a=>a.id===id&&a.downloadUrl))throw Error('New Windows package missing: '+id)"
          if [ '${{ matrix.platform }}' = 'darwin' ]; then
            pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never
          else
            pnpm exec electron-builder --linux AppImage --${{ matrix.arch }} --publish never
          fi
          node scripts/release-metadata.cjs
      - name: Verify packaged Linux launcher
        timeout-minutes: 3
        if: matrix.platform == 'linux'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dist/TMApps-Launcher-*-linux-${{ matrix.arch }}.AppImage --no-sandbox --smoke "$PWD/build/packaged-smoke.json"
      - name: Verify packaged macOS launcher
        timeout-minutes: 3
        if: matrix.platform == 'darwin'
        run: |
          DMG=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          hdiutil verify "$DMG"
          MOUNT="$PWD/build/mounted-installer"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          BUNDLE=$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print -quit)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$BUNDLE/Contents/Info.plist")" = "com.tmapps.launcher"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUNDLE/Contents/Info.plist")" = "$(node -p "require('./package.json').version")"
          codesign --verify --deep --strict "$BUNDLE"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$BUNDLE/Contents/Info.plist")
          "$BUNDLE/Contents/MacOS/$EXECUTABLE" --smoke "$PWD/build/packaged-smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.sha256
            desktop/dist/metadata-*.json
            desktop/build/*smoke.json
            desktop/build/*smoke.json.png
  publish-native:
    name: Publish macOS and Linux launcher downloads
    needs: [publish, native-launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-native-*
          path: native-release
          merge-multiple: true
      - name: Upload native installers before their update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const path=require('node:path');
          function files(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?files(path.join(dir,e.name)):[path.join(dir,e.name)]);}
          const all=files('native-release'); const metadata=all.filter(p=>/metadata-.*\.json$/.test(p)).map(p=>JSON.parse(fs.readFileSync(p,'utf8')));
          if(metadata.length!==4||new Set(metadata.map(m=>m.platform+'-'+m.arch)).size!==4||new Set(metadata.map(m=>m.version)).size!==1)throw Error('Missing native build');
          const crypto=require('node:crypto'); for(const m of metadata){const file=all.find(p=>path.basename(p)===m.filename);if(!file||crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==m.sha256)throw Error('Native artifact checksum mismatch');}
          for(const m of metadata){const source=all.find(p=>path.basename(p)===m.filename);const alias=`TMApps-Launcher-${m.platform==='darwin'?'mac':'linux'}-${m.arch}.${m.platform==='darwin'?'dmg':'AppImage'}`;fs.copyFileSync(source,path.join('native-release',alias));fs.writeFileSync(path.join('native-release',alias+'.sha256'),m.sha256+'  '+alias+'\n');}
          fs.writeFileSync('launcher-platforms.json',JSON.stringify({schemaVersion:1,version:metadata[0].version,updatedAt:new Date().toISOString(),releases:metadata.map(({version,...m})=>m)},null,2));
          NODE
          find native-release -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.sha256' \) -print0 | xargs -0 gh release upload tma-apps --clobber
          gh release upload tma-apps launcher-platforms.json --clobber
          gh release edit tma-apps --title 'TMApps - Windows, macOS and Linux downloads'
