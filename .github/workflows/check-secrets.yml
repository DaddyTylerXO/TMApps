name: Check release credentials
on: [push, pull_request]
jobs:
  secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history and ZIP contents
        shell: pwsh
        run: |
          ./tests/SecretScanTests.ps1
          ./check-secrets.ps1 -Revision HEAD
